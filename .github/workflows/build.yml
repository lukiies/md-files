name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: windows-x64
          - os: ubuntu-latest
            name: linux-x64
          - os: macos-latest
            name: macos-arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux WebKitGTK
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libxdo-dev

      - name: Test
        run: cargo test --workspace

      - name: Build release
        run: cargo build --release

      - name: Package
        shell: bash
        run: |
          mkdir -p dist
          if [ "$RUNNER_OS" = "Windows" ]; then
            cp target/release/mdread.exe target/release/md2html.exe target/release/md2docx.exe dist/
          else
            cp target/release/mdread target/release/md2html target/release/md2docx dist/
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: md-files-${{ matrix.name }}
          path: dist/
